name: Release NuGet Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        run: dotnet pack -c Release -o out Ezacloud.Sdk.csproj

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          else
            echo "NUGET_API_KEY secret not found; attempting trusted publishing..."
            dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate || {
              echo "Note: If using an API key, configure the NUGET_API_KEY secret in repository settings."
              exit 1
            }
          fi
